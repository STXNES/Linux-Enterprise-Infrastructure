# ==============================================================================
# /etc/sysctl.d/99-security-hardening.conf
# CIS Benchmark Level 2 Hardening - Debian 12 / RHEL 9
# Author: Axell Rojas (https://github.com/STXNES)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network Layer Protection (IP Spoofing, Syn Flood, ICMP Redirects)
# ------------------------------------------------------------------------------

# Enable TCP SYN Cookies (mitigates SYN flood attacks)
net.ipv4.tcp_syncookies = 1

# Enforce Reverse Path Filtering (Strict mode to prevent IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable Source Routing (prevents attackers from dictating packet routing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Disable ICMP Redirect acceptance (mitigates MITM routing table poisoning)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable sending ICMP redirects (server is not a router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignore broadcast ICMP ping requests (prevents Smurf attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error messages
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log martian packets (spoofed packets, impossible addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Disable IP forwarding (enable only if configuring a gateway/router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# ------------------------------------------------------------------------------
# 2. Kernel Self-Protection & Memory Security
# ------------------------------------------------------------------------------

# Restrict dmesg access to users with CAP_SYSLOG
kernel.dmesg_restrict = 1

# Hide exposed kernel pointers in /proc to unprivileged processes (KASLR leak prevention)
kernel.kptr_restrict = 2

# Restrict access to performance monitoring events
kernel.perf_event_paranoid = 3

# Disable unprivileged eBPF (Berkeley Packet Filter) execution
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Enforce Address Space Layout Randomization (ASLR)
kernel.randomize_va_space = 2

# Restrict ptrace process tracing (Yama LSM: only parent process can trace)
kernel.yama.ptrace_scope = 2

# Disable Magic SysRq key except for sync (mitigates local console misuse)
kernel.sysrq = 16

# ------------------------------------------------------------------------------
# 3. File System & Link Protection
# ------------------------------------------------------------------------------

# Restrict creation of hardlinks to files owned by the current user
fs.protected_hardlinks = 1

# Restrict following symlinks in sticky world-writable directories (/tmp)
fs.protected_symlinks = 1

# Prevent FIFO and regular file spoofing in sticky world-writable dirs
fs.protected_fifos = 2
fs.protected_regular = 2

# Increase maximum open file descriptors for high-traffic daemons
fs.file-max = 2097152
