# ==============================================================================
# /etc/ssh/sshd_config.d/99-hardening.conf
# CIS Benchmark Level 2 Hardening - OpenSSH Server Configuration
# Author: Axell Rojas (https://github.com/STXNES)
# ==============================================================================

# Network & Port Configuration
Port 2222
AddressFamily inet
ListenAddress 0.0.0.0

# Protocol & Host Keys (Enforce ED25519)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

# Cryptographic Algorithms (CIS / Mozilla Modern Suite)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Authentication Policies
PermitRootLogin no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
UsePAM yes

# Session & Connection Limits
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Forwarding & Sandboxing (Least Privilege)
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitUserEnvironment no
PermitTunnel no
Banner /etc/issue.net

# Logging & Auditing
LogLevel VERBOSE
SyslogFacility AUTH

# User Whitelist (Adjust per environment)
AllowGroups sshusers sudo wheel
