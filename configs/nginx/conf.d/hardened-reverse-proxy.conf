# ==============================================================================
# /etc/nginx/conf.d/hardened-reverse-proxy.conf
# Production Hardened Reverse Proxy Virtual Host
# Author: Axell Rojas (https://github.com/STXNES)
# ==============================================================================

# Upstream Backend Application Cluster
upstream backend_service {
    server 127.0.0.1:8080 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP 80 -> HTTPS 443 Permanent Redirection (CIS 2.1.1)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow Let's Encrypt / ACME challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 Redirect for all other traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS 443 -> Hardened Reverse Proxy (TLS 1.3 & HTTP/2)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name infra.internal.lan;

    # SSL Certificates (Managed via Let's Encrypt or Corporate PKI)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Include Security & SSL Baseline Snippets
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Apply Rate Limiting & Connection Limits
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn addr_conn 20;

    # Root Document & Static Error Pages
    root /var/www/html;
    index index.html index.htm;

    # Reverse Proxy Location Routing
    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        # Header Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Block access to hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 '{"status":"UP","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
}
