# ==============================================================================
# /etc/nginx/snippets/security-headers.conf
# HTTP Security Headers (OWASP Recommended)
# Author: Axell Rojas (https://github.com/STXNES)
# ==============================================================================

# Enforce HTTPS via Strict-Transport-Security (HSTS - 2 years + subdomains + preload)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable legacy browser XSS filters
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer information passed in headers
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (Adjust connect-src / script-src for specific app endpoints)
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;

# Restrict browser permissions and sensors
add_header Permissions-Policy "geolocation=(), midi=(), camera=(), microphone=(), usb=()" always;
