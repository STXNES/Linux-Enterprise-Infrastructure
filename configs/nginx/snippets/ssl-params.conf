# ==============================================================================
# /etc/nginx/snippets/ssl-params.conf
# Mozilla SSL Modern / TLS 1.3 Hardened Parameters
# Author: Axell Rojas (https://github.com/STXNES)
# ==============================================================================

# Protocols: Exclusively TLSv1.3 and TLSv1.2 (SSLv3, TLS 1.0, 1.1 disabled)
ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.3 Ciphersuites & TLS 1.2 Strong Modern Ciphers
ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
ssl_prefer_server_ciphers off;

# Diffie-Hellman Parameter for DHE ciphersuites (Generated via openssl dhparam -out /etc/nginx/dhparam.pem 4096)
# ssl_dhparam /etc/nginx/dhparam.pem;

# SSL Session Optimization
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP Stapling (Validates certificate revocation without client latency)
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4 valid=300s;
resolver_timeout 5s;
